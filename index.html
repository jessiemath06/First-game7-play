    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --stone-dark: #2c3e50;
            --stone-light: #546e7a;
            --dust-yellow: #d4a373;
            --rust-orange: #e07a5f;
            --metal-gray: #8d99ae;
            --danger-red: #c1121f;
        }

        body {
            margin: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #1e1e1e;
            background-image: radial-gradient(#3a3a3a 1px, transparent 1px);
            background-size: 20px 20px;
            color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- 手機直向提示 --- */
        #orientation-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; color: var(--dust-yellow);
            text-align: center; justify-content: center; align-items: center;
            flex-direction: column; font-size: 24px; font-weight: bold;
        }
        @media screen and (max-width: 767px) and (orientation: portrait) {
            #orientation-warning { display: flex; }
            #main-wrapper { display: none; }
        }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 4%;
            background: linear-gradient(90deg, #111, var(--stone-dark));
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; border-bottom: 3px solid var(--dust-yellow);
        }
        .hero-left { display: flex; align-items: center; gap: 12px; }
        .hero-logo-circle {
            width: 50px; height: 50px; background-color: var(--dust-yellow); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid #fff;
        }
        .brand-name { font-size: 24px; font-weight: 900; color: var(--dust-yellow); letter-spacing: 2px; }

        .nav-right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .nav-link {
            text-decoration: none; color: #ddd; padding: 6px 14px; border-radius: 5px;
            border: 1px solid var(--metal-gray); font-size: 14px; display: flex; align-items: center; gap: 6px;
            transition: 0.3s; background: rgba(255,255,255,0.05);
        }
        .nav-link:hover { background: var(--metal-gray); color: #fff; }
        .nav-link.back-g6 { border-color: var(--rust-orange); color: var(--rust-orange); font-weight: bold; }

        #login-overlay, #result-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        #result-overlay { z-index: 3000; }

        .login-box {
            background: var(--stone-dark); padding: 40px; border-radius: 10px; text-align: center;
            width: 85%; max-width: 420px; border: 2px solid var(--metal-gray); box-shadow: 0 0 20px rgba(212, 163, 115, 0.2);
        }
        .login-box h2 { color: var(--dust-yellow); margin-bottom: 10px;}
        .login-box p { color: #ccc; }
        .login-box input {
            padding: 12px; width: 80%; font-size: 18px; border: 2px solid var(--metal-gray);
            border-radius: 5px; margin-bottom: 25px; background: #222; color: #fff; text-align: center;
        }

        main { flex: 1; max-width: 1100px; margin: 20px auto; width: 95%; text-align: center; position: relative; }
        .game-stats {
            display: flex; justify-content: space-around; background: var(--stone-light);
            color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-size: 18px; border: 1px solid var(--metal-gray); font-weight: bold;
        }
        .control-panel { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn-ctrl { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .btn-mute { background: #9b59b6; color: white; }
        .btn-pause { background: #f39c12; color: white; }
        .btn-restart { background: var(--danger-red); color: white; }
        .btn-whiteboard { background: #3498db; color: white; }

        .game-header { 
            background: rgba(44, 62, 80, 0.8); padding: 20px; border-radius: 5px; 
            margin-bottom: 20px; border-left: 8px solid var(--dust-yellow); 
        }

        .shelves {
            background: #2a2a2a; padding: 25px; border-radius: 5px;
            display: grid; gap: 15px; border: 2px solid #444; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .item-prize {
            background: #333; border-radius: 8px; padding: 15px 10px; cursor: pointer;
            transition: 0.2s; border: 3px solid #555; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; color: #fff;
        }
        .item-prize.selected { border-color: var(--dust-yellow); background: #4a4a4a; transform: translateY(-5px); box-shadow: 0 8px 15px rgba(212, 163, 115, 0.4); }
        .prize-icon { font-size: 48px; margin-bottom: 10px; filter: drop-shadow(2px 4px 6px black); }
        .prize-tag { font-size: 14px; font-weight: bold; color: var(--dust-yellow); background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }

        .item-prize.reveal-correct {
            border-color: #2ecc71 !important;
            background: rgba(46, 204, 113, 0.25) !important;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.8) !important;
            transform: scale(1.05);
        }
        .item-prize.reveal-wrong {
            border-color: #e74c3c !important;
            background: rgba(231, 76, 60, 0.15) !important;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.6) !important;
            opacity: 0.6;
        }

        #feedback-panel { margin: 20px auto; padding: 20px; border-radius: 5px; display: none; max-width: 700px; font-size: 17px; line-height: 1.6; text-align: left; }
        .correct { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; text-align: center; }
        .wrong { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }

        .btn-submit {
            background: var(--rust-orange); color: white; border: none; padding: 16px 60px; border-radius: 5px;
            font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 5px 0 #9c4a36; letter-spacing: 2px;
        }
        .btn-submit:active { transform: translateY(5px); box-shadow: 0 0 0 #9c4a36; }
        .btn-submit:disabled { background: #555; box-shadow: none; cursor: not-allowed; transform: none; }

        .rank-section { margin-top: 40px; background: rgba(44, 62, 80, 0.9); padding: 20px; border-radius: 5px; text-align: left; border: 1px solid var(--metal-gray); }
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #ddd; }
        .rank-table th { border-bottom: 2px solid var(--dust-yellow); padding: 10px; text-align: left; color: var(--dust-yellow); }
        .rank-table td { padding: 10px; border-bottom: 1px dashed #555; }
        .medal { font-size: 20px; margin-right: 5px; }

        /* 白板 */
        #whiteboard-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 500; display: flex; flex-direction: column; }
        #whiteboard-canvas { width: 100%; height: 100%; cursor: crosshair; }
        .whiteboard-controls { position: fixed; bottom: 80px; right: 20px; pointer-events: auto; display: none; flex-direction: column; gap: 10px; z-index: 501; }
        .wb-btn { background: #34495e; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }

        footer { padding: 30px 5% 20px; background: #111; border-top: 2px solid #333; margin-top: auto; }
        .footer-pill { background-color: #222; color: #aaa; border-radius: 5px; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid #444; }
        .footer-left { display: flex; align-items: center; gap: 10px; }
        .footer-dot { width: 8px; height: 8px; background: var(--dust-yellow); border-radius: 50%; }
        .footer-copy { font-size: 13px; }
        .footer-right { display: flex; align-items: center; gap: 10px; }

        @media (max-width: 767px) {
            .brand-name { font-size: 20px; }
            .shelves { gap: 10px; padding: 15px; }
            .footer-pill { justify-content: center; text-align: center; }
            .hero-logo-circle { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div>請將裝置轉為橫向<br>以獲得最佳遊戲體驗</div>
</div>

<div id="main-wrapper">

        <div class="login-box">
            <div class="hero-logo-circle" style="margin: 0 auto 20px;"><i class="fas fa-cogs" style="font-size:24px; color:#222;"></i></div>

    <div id="result-overlay" style="display:none;">
        <div class="login-box" style="text-align:center;">
            <h2 id="result-title" style="color:var(--dust-yellow); font-size: 28px;"></h2>
            <div id="result-badge" style="display:none; margin: 20px auto;">
                <img src="G6-U7.jpg" style="max-width:200px; border-radius:10px; border:4px solid var(--dust-yellow); box-shadow: 0 0 15px var(--dust-yellow);">
                <p style="color:var(--dust-yellow); font-weight:bold; margin-top:10px; font-size:18px;">✨ 榮譽修復徽章 ✨</p>
            </div>

        <button class="wb-btn" onclick="clearCanvas()" title="清除筆跡"><i class="fas fa-eraser"></i></button>
        <button class="wb-btn" style="background:#e74c3c" onclick="toggleWhiteboard()" title="關閉畫筆"><i class="fas fa-times"></i></button>

    <header>
        <div class="hero-left">
            <div class="hero-logo-circle"><i class="fas fa-cogs" style="font-size:24px; color:#222;"></i></div>
            <div class="brand-name">Jessie Math 捷析</div>
        </div>

            <a href="https://jessiemath0703-chu.github.io/website2/" class="nav-link"><i class="fas fa-home"></i> 捷析首頁</a>

    <main>
        <div class="game-stats">
            <span><i class="fas fa-user-shield"></i> 玩家：<span id="display-name" style="color:var(--dust-yellow)">---</span></span>
            <span><i class="fas fa-stopwatch"></i> 剩餘時間：<span id="timer" style="color:#e74c3c">75</span>s</span>
            <span><i class="fas fa-box-open" style="color:var(--dust-yellow)"></i> 已收集：<span id="score">0</span> / 15 個</span>
        </div>

        <div class="control-panel">
            <button class="btn-ctrl btn-mute" onclick="toggleMute()" id="mute-btn"><i class="fas fa-volume-up"></i> 音效</button>
            <button class="btn-ctrl btn-whiteboard" onclick="toggleWhiteboard()"><i class="fas fa-pen"></i> 啟用計算白板</button>
            <button class="btn-ctrl btn-pause" onclick="togglePause()" id="pause-btn"><i class="fas fa-pause"></i> 暫停</button>
            <button class="btn-ctrl btn-restart" onclick="confirmReset()"><i class="fas fa-redo"></i> 重新開始</button>
        </div>

        <div class="game-header"> 
            <h3 style="margin:0; color:#fff;"><span id="target-title">目標凹槽資訊：</span><strong id="target-value" style="color: var(--dust-yellow); font-size: 1.8em;">--</strong></h3>
            <p style="margin: 10px 0 0; color: #bbb;"><small id="target-desc">機關即將閉合！請計算出正確數值！</small></p>
        </div>

        <div class="shelves" id="shelves-container"></div>
        <div id="feedback-panel"></div>

        <button class="btn-submit" id="submit-btn" onclick="submitAnswer()">安裝並確認</button>

        <div class="rank-section">
            <h4 style="margin:0 0 10px; color:var(--dust-yellow); font-size:20px;"><i class="fas fa-trophy"></i> 生存者榮譽榜 (Top 10)</h4>
            <table class="rank-table">
                <thead><tr><th>名次</th><th>玩家</th><th>紀錄時間</th><th>收集數 (剩餘秒數)</th></tr></thead>
                <tbody id="rank-display"><tr><td colspan="4" style="text-align:center;">載入中...</td></tr></tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="footer-pill">
            <div class="footer-left"><div class="footer-dot"></div><div class="footer-copy">© 2025–2026 捷析老師. All rights reserved.</div></div>
            <div class="footer-right"><div class="footer-tagline">數學不迷路，在迷宮中找到解答。</div><i class="fas fa-compass" style="margin-left:5px"></i></div>
        </div>
    </footer>
</div>

<script>
    const PI = 3.14;
    let playerName = "";
    let score = 0; 
    let timeLeft = 75; 
    let isPaused = false;
    let timerInterval;
    let targetDia = 0;
    let minDia = 0;
    let maxDia = 0;
    let currentQType = 1; 
    let prizes = [];
    let levelTimeout = null; 

    // --- 音效系統 ---
    const bgm = new Audio('3.mp3');
    bgm.loop = true;
    bgm.volume = 0.5;

    const sfxPlayer = new Audio(); 
    let sfxTimer = null;
    let isMuted = false;

    // 手動音效開關
    function toggleMute() {
        isMuted = !isMuted;
        const muteBtn = document.getElementById('mute-btn');
        if (isMuted) {
            muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i> 靜音';
            muteBtn.style.background = '#7f8c8d';
            bgm.muted = true;
            sfxPlayer.muted = true;
        } else {
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i> 音效';
            muteBtn.style.background = '#9b59b6';
            bgm.muted = false;
            sfxPlayer.muted = false;
        }
    }

    function playSound(type) {
        if (isMuted) return; // 靜音狀態不播放
        
        let file = '';

        if (type === 'select') { file = '1.mp3'; }
        else if (type === 'deselect') { file = '2.mp3'; }
        else if (type === 'success') { file = '4.mp3'; }
        else if (type === 'fail') { file = '5.mp3'; }

        // 切換來源自動中斷前一個音效，保證不重疊
        sfxPlayer.src = file;
        sfxPlayer.currentTime = 0;
        sfxPlayer.play().catch(e => console.log("音效播放被阻擋：", e));

        if (sfxTimer) clearTimeout(sfxTimer);
        // 設定強制三秒後停止，保留前三到四秒即可
        sfxTimer = setTimeout(() => { 
            sfxPlayer.pause(); 
        }, 3000);
    }

    const prizePool = [
        { i: '🛞', n: '輪胎' }, { i: '⚙️', n: '齒輪' }, { i: '🪫', n: '電池' }, { i: '🥫', n: '罐頭' },
        { i: '🪢', n: '繩索' }, { i: '🔦', n: '手電筒' }, { i: '🚰', n: '水壺' }, { i: '🎒', n: '背包' },
        { i: '🔧', n: '扳手' }, { i: '📻', n: '對講機' }, { i: '💊', n: '醫療包' }, { i: '🧭', n: '指南針' }
    ];

    function startGame() {
        const input = document.getElementById('player-name-input');
        if (!input.value.trim()) { alert("請先輸入代號！"); return; }
        playerName = input.value;
        document.getElementById('display-name').innerText = playerName;
        document.getElementById('login-overlay').style.display = 'none';
        
        bgm.play().catch(e => console.log("BGM 自動播放被阻擋"));
        resetGame();
    }

    function confirmReset() {
        if(confirm("確定要放棄當前進度重新開始嗎？收集進度將歸零。")) resetGame();
    }

    function resetGame() {
        if (levelTimeout) clearTimeout(levelTimeout);
        score = 0; timeLeft = 75; isPaused = false;
        clearInterval(timerInterval);
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('pause-btn').innerHTML = '<i class="fas fa-pause"></i> 暫停';
        document.getElementById('feedback-panel').style.display = 'none';
        
        updateRankDisplay();
        nextLevel();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) gameOver();
            }
        }, 1000);
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerHTML = isPaused ? '<i class="fas fa-play"></i> 繼續' : '<i class="fas fa-pause"></i> 暫停';
    }

    function nextLevel() {
        if (levelTimeout) clearTimeout(levelTimeout);
        const container = document.getElementById('shelves-container');
        const feedback = document.getElementById('feedback-panel');
        container.innerHTML = '';
        feedback.style.display = 'none';
        
        document.getElementById('submit-btn').disabled = false;

        // 隨機產生 12 到 15 個物資
        const numItems = Math.floor(Math.random() * 4) + 12; 
        
        // 確保平分兩列排法
        const colCount = Math.ceil(numItems / 2);
        container.style.gridTemplateRows = "repeat(2, 1fr)";
        container.style.gridTemplateColumns = `repeat(${colCount}, 1fr)`;

        // 題型 1~5 隨機
        currentQType = Math.floor(Math.random() * 5) + 1;
        targetDia = Math.floor(Math.random() * 10) + 20;
        minDia = targetDia - Math.floor(Math.random() * 3) - 2;
        maxDia = targetDia + Math.floor(Math.random() * 3) + 2;

        const titleEl = document.getElementById('target-title');
        const valEl = document.getElementById('target-value');
        const descEl = document.getElementById('target-desc');

        switch (currentQType) {
            case 1:
                titleEl.innerText = "目標凹槽直徑：";
                valEl.innerText = targetDia + " cm";
                descEl.innerText = "請找出尺寸【剛剛好】等於凹槽直徑的物資！(提示：物品標示為圓周長)";
                break;
            case 2:
                titleEl.innerText = "目標凹槽直徑：";
                valEl.innerText = targetDia + " cm";
                descEl.innerText = "請找出所有尺寸【小於或等於】凹槽直徑的物資！(提示：物品標示為圓周長)";
                break;
            case 3:
                titleEl.innerText = "目標凹槽圓周長：";
                valEl.innerText = (targetDia * PI).toFixed(2) + " cm";
                descEl.innerText = "請找出尺寸【剛剛好】等於凹槽的物資！(提示：物品標示為半徑或直徑)";
                break;
            case 4:
                titleEl.innerText = "目標凹槽圓周長：";
                valEl.innerText = (targetDia * PI).toFixed(2) + " cm";
                descEl.innerText = "請找出所有尺寸【小於或等於】凹槽的物資！(提示：物品標示為半徑或直徑)";
                break;
            case 5:
                titleEl.innerText = "目標範圍：";
                valEl.innerText = `${minDia} cm ~ ${maxDia} cm`;
                descEl.innerText = "請找出尺寸【符合此範圍】的物資！(標示可能為半徑、直徑或圓周長)";
                break;
        }

        let tempPool = [...prizePool].sort(() => Math.random() - 0.5);
        prizes = [];
        let hasCorrect = false;

        for (let i = 0; i < numItems; i++) {
            let isCorrect = Math.random() > 0.6; // 約 40% 機率是正確的
            if (i === numItems - 1 && !hasCorrect) isCorrect = true; // 確保至少有一個正確答案

            let itemDia;
            let canFit = false;

            if (currentQType === 1 || currentQType === 3) {
                // 精確配對
                itemDia = isCorrect ? targetDia : targetDia + (Math.random() > 0.5 ? (Math.floor(Math.random() * 4) + 1) : -(Math.floor(Math.random() * 4) + 1));
                canFit = (itemDia === targetDia);
            } else if (currentQType === 2 || currentQType === 4) {
                // 小於或等於
                itemDia = isCorrect ? targetDia - Math.floor(Math.random() * 5) : targetDia + Math.floor(Math.random() * 5) + 1;
                canFit = (itemDia <= targetDia);
            } else if (currentQType === 5) {
                // 範圍區間
                itemDia = isCorrect ? 
                    Math.floor(Math.random() * (maxDia - minDia + 1)) + minDia : 
                    (Math.random() > 0.5 ? minDia - Math.floor(Math.random() * 3) - 1 : maxDia + Math.floor(Math.random() * 3) + 1);
                canFit = (itemDia >= minDia && itemDia <= maxDia);
            }

            if (canFit) hasCorrect = true;

            let labelStr = "";
            if (currentQType === 1 || currentQType === 2) {
                labelStr = `周長: ${(itemDia * PI).toFixed(2)}cm`;
            } else if (currentQType === 3 || currentQType === 4) {
                let isRadius = Math.random() > 0.5;
                labelStr = isRadius ? `半徑: ${itemDia / 2}cm` : `直徑: ${itemDia}cm`;
            } else if (currentQType === 5) {
                let randFmt = Math.floor(Math.random() * 3);
                if (randFmt === 0) labelStr = `周長: ${(itemDia * PI).toFixed(2)}cm`;
                else if (randFmt === 1) labelStr = `半徑: ${itemDia / 2}cm`;
                else labelStr = `直徑: ${itemDia}cm`;
            }
            
            prizes.push({
                id: i,
                icon: tempPool[i % tempPool.length].i,
                label: labelStr,
                realDia: itemDia,
                canFit: canFit
            });

            const card = document.createElement('div');
            card.className = 'item-prize';
            card.id = `prize-${i}`;
            card.onclick = () => { 
                if(isPaused || document.getElementById('submit-btn').disabled) return;
                card.classList.toggle('selected'); 
                if(card.classList.contains('selected')) {
                    playSound('select');
                } else {
                    playSound('deselect');
                }
            };
            card.innerHTML = `<div class="prize-icon">${prizes[i].icon}</div><div class="prize-tag">${prizes[i].label}</div>`;
            container.appendChild(card);
        }
    }

    function submitAnswer() {
        if(isPaused || document.getElementById('submit-btn').disabled) return;
        
        const selectedEls = document.querySelectorAll('.item-prize.selected');
        const selectedIds = Array.from(selectedEls).map(el => parseInt(el.id.split('-')[1]));
        const correctItems = prizes.filter(p => p.canFit);
        const correctIds = correctItems.map(p => p.id);

        const correctSelected = selectedIds.filter(id => correctIds.includes(id)).length;
        const wrongSelected = selectedIds.filter(id => !correctIds.includes(id)).length;

        const feedback = document.getElementById('feedback-panel');
        feedback.style.display = 'block';
        
        // 鎖定畫面避免重複點擊
        document.getElementById('submit-btn').disabled = true;
        document.querySelectorAll('.item-prize').forEach(el => el.style.pointerEvents = 'none');

        // 亮燈回饋
        prizes.forEach(p => {
            const el = document.getElementById(`prize-${p.id}`);
            if (p.canFit) {
                el.classList.add('reveal-correct'); // 正確物資亮綠燈
            } else {
                el.classList.add('reveal-wrong');   // 錯誤物資亮紅燈
            }
        });

        // 將選對的物資數量加入總分
        let caughtThisRound = correctSelected;
        score += caughtThisRound;
        document.getElementById('score').innerText = score;

        // 如果達到 15 個直接過關
        if (score >= 15) {
            gameWin();
            return;
        }

        let ansNames = correctItems.map(p => p.label).join('、');
        if(ansNames === "") ansNames = "本輪無符合尺寸的物資";

        if (wrongSelected > 0) {
            playSound('fail'); 
            feedback.className = 'wrong';
            feedback.innerHTML = `<strong>⚠️ 系統警告：混入尺寸不符的零件！</strong><br>
                但您仍成功收集了 <strong>${caughtThisRound}</strong> 個正確物資。<br>
                目前累積進度：${score} / 15。<br>
                <strong>正確應選尺寸為：</strong>${ansNames}`;
        } else {
            playSound('success');
            feedback.className = 'correct';
            
            if (correctSelected === correctIds.length && correctIds.length > 0) {
                feedback.innerHTML = `<strong>⚙️ 完美安裝！判斷精準！</strong><br>本次成功收集 <strong>${caughtThisRound}</strong> 個物資。<br>目前累積進度：${score} / 15。`;
            } else if (correctSelected > 0) {
                feedback.innerHTML = `<strong>⚙️ 部分安裝成功！</strong><br>本次成功收集 <strong>${caughtThisRound}</strong> 個物資 (遺漏了部分正確物資)。<br>目前累積進度：${score} / 15。`;
            } else {
                feedback.innerHTML = `<strong>⚠️ 系統提示：未收集到任何物資！</strong><br>本次收集 <strong>0</strong> 個物資。<br>請記得點擊符合條件的物資再確認！`;
            }
        }
        
        levelTimeout = setTimeout(() => {
            if(timeLeft > 0) nextLevel();
        }, 3000);
    }

    // --- 遊戲過關與失敗邏輯 ---
    function gameWin() {
        clearInterval(timerInterval);
        if (levelTimeout) clearTimeout(levelTimeout);
        bgm.pause();
        playSound('success');
        
        document.getElementById('result-title').innerText = "🎉 闖關成功！";
        document.getElementById('result-badge').style.display = 'block'; 
        document.getElementById('result-desc').innerHTML = `${playerName}，太棒了！<br>你成功在時間內收集了 <strong>${score}</strong> 個物資！<br>剩餘時間：${timeLeft} 秒`;
        document.getElementById('result-overlay').style.display = 'flex';
        
        saveRank(playerName, score, timeLeft);
    }

    function gameOver() {
        clearInterval(timerInterval);
        if (levelTimeout) clearTimeout(levelTimeout);
        bgm.pause();
        playSound('fail');
        
        document.getElementById('result-title').innerText = "💀 挑戰失敗！";
        document.getElementById('result-badge').style.display = 'none'; 
        document.getElementById('result-desc').innerHTML = `時間到！<br>${playerName}，你只收集了 <strong>${score}</strong> 個物資，未達成 15 個的目標。<br>請重新啟動機關再試一次！`;
        document.getElementById('result-overlay').style.display = 'flex';
        
        saveRank(playerName, score, 0);
    }

    function backToLogin() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('login-overlay').style.display = 'flex';
    }

    // --- 排行榜邏輯 ---
    function saveRank(name, score, time) {
        let ranks = JSON.parse(localStorage.getItem('jessiemath_gear_ranks') || '[]');
        let now = new Date();
        let timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        
        ranks.push({ name, score, time: time, date: timeStr });
        
        ranks.sort((a, b) => {
            if(b.score !== a.score) return b.score - a.score;
            return b.time - a.time;
        });
        
        localStorage.setItem('jessiemath_gear_ranks', JSON.stringify(ranks.slice(0, 10)));
        updateRankDisplay();
    }

    function updateRankDisplay() {
        let ranks = JSON.parse(localStorage.getItem('jessiemath_gear_ranks') || '[]');
        const display = document.getElementById('rank-display');
        
        if(ranks.length === 0) {
            display.innerHTML = `<tr><td colspan="4" style="text-align:center;">尚無生存者紀錄，等你來挑戰！</td></tr>`;
        } else {
            display.innerHTML = ranks.map((r, i) => {
                let medal = "";
                if (i === 0) medal = '<span class="medal">🥇</span>';
                else if (i === 1) medal = '<span class="medal">🥈</span>';
                else if (i === 2) medal = '<span class="medal">🥉</span>';
                else medal = '<span class="medal" style="font-size:16px;">💠</span>';

                let scoreText = `${r.score} 個 <span style="font-size:12px;color:#aaa;">(${r.time}s)</span>`;

                return `<tr>
                    <td>${medal} ${i+1}</td>
                    <td><strong>${r.name}</strong></td>
                    <td>${r.date}</td>
                    <td style="color:var(--dust-yellow); font-weight:bold;">${scoreText}</td>
                </tr>`;
            }).join('');
        }
    }

    /* === 白板功能實作 === */
    const wbWrapper = document.getElementById('whiteboard-wrapper');
    const wbCanvas = document.getElementById('whiteboard-canvas');
    const wbControls = document.getElementById('wb-controls');
    const ctx = wbCanvas.getContext('2d');
    let isDrawing = false;
    let wbActive = false;

    function resizeCanvas() { wbCanvas.width = window.innerWidth; wbCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function toggleWhiteboard() {
        wbActive = !wbActive;
        if (wbActive) {
            wbWrapper.style.pointerEvents = 'auto';
            wbWrapper.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            wbControls.style.display = 'flex';
        } else {
            wbWrapper.style.pointerEvents = 'none';
            wbWrapper.style.backgroundColor = 'transparent';
            wbControls.style.display = 'none';
        }
    }
    function clearCanvas() { ctx.clearRect(0, 0, wbCanvas.width, wbCanvas.height); }

    function getPos(e) {
        const rect = wbCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        if(!wbActive) return;
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
    }

    function draw(e) {
        if (!isDrawing || !wbActive) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }
    function stopDraw() { isDrawing = false; }

    wbCanvas.addEventListener('mousedown', startDraw);
    wbCanvas.addEventListener('mousemove', draw);
    wbCanvas.addEventListener('mouseup', stopDraw);
    wbCanvas.addEventListener('mouseout', stopDraw);

    wbCanvas.addEventListener('touchstart', startDraw, {passive: false});
    wbCanvas.addEventListener('touchmove', draw, {passive: false});
    wbCanvas.addEventListener('touchend', stopDraw);

    updateRankDisplay();
</script>
