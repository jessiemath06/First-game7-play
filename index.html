<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jessie Math - 套圈圈積分挑戰賽 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-yellow: #FFD700;
            --brand-blue: #2c3e50;
            --accent-purple: #6c5ce7;
            --wood-brown: #8d6e63;
        }

        body {
            margin: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header 品牌區 (與截圖比例一致) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4%;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .hero-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hero-logo-circle {
            width: 50px;
            height: 50px;
            background-color: var(--brand-yellow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .hero-logo-circle img { width: 100%; height: auto; }

        .brand-name {
            font-size: 26px;
            font-weight: 900;
            color: var(--brand-blue);
        }

        .nav-right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

        .nav-link {
            text-decoration: none;
            color: #444;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .nav-link.back-g6 { border-color: var(--accent-purple); color: var(--accent-purple); background: #fdfcff; font-weight: bold; }

        /* --- 登入畫面 --- */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }

        .login-box {
            background: white; padding: 40px; border-radius: 25px; text-align: center;
            width: 85%; max-width: 420px;
        }

        .login-box input { padding: 12px; width: 85%; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 25px; }

        /* --- 遊戲主區域 (RWD) --- */
        main { flex: 1; max-width: 1100px; margin: 20px auto; width: 95%; text-align: center; }

        .game-stats {
            display: flex; justify-content: space-around; background: var(--brand-blue);
            color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; font-size: 18px;
        }

        .control-panel { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; }

        .btn-ctrl { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-pause { background: #f39c12; color: white; }
        .btn-restart { background: #e74c3c; color: white; }

        .game-header { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-bottom: 5px solid var(--brand-yellow); }

        .shelves {
            background: #d7ccc8; padding: 25px; border-radius: 15px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 15px; border-bottom: 12px solid var(--wood-brown);
        }

        .item-prize {
            background: white; border-radius: 12px; padding: 12px; cursor: pointer;
            transition: 0.2s; border: 3px solid transparent; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center;
        }

        .item-prize.selected { border-color: var(--brand-yellow); background: #fffde7; transform: scale(1.03); }

        .prize-icon { font-size: 48px; margin-bottom: 10px; }
        .prize-tag { font-size: 14px; font-weight: bold; color: #333; }

        /* 回饋解析 */
        #feedback-panel {
            margin: 20px auto; padding: 20px; border-radius: 12px; display: none;
            max-width: 700px; font-size: 17px; line-height: 1.6; text-align: left;
        }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; text-align: center; }
        .wrong { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .btn-submit {
            background: var(--brand-blue); color: white; border: none;
            padding: 16px 60px; border-radius: 50px; font-size: 20px; font-weight: bold;
            cursor: pointer; margin-top: 20px; box-shadow: 0 5px 0 #151e27;
        }

        .rank-section { margin-top: 30px; background: white; padding: 20px; border-radius: 15px; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* --- Footer (格式嚴格遵守) --- */
        footer { padding: 30px 5% 20px; }
        .footer-pill {
            background-color: #333; color: white; border-radius: 50px; padding: 12px 30px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .footer-left { display: flex; align-items: center; gap: 10px; }
        .footer-dot { width: 8px; height: 8px; background: var(--brand-yellow); border-radius: 50%; }
        .footer-copy { font-size: 13px; }
        .footer-right { display: flex; align-items: center; gap: 10px; }
        .footer-tagline { font-size: 13px; font-style: italic; opacity: 0.9; }

        /* RWD 手機板佈局 */
        @media (max-width: 600px) {
            .brand-name { font-size: 22px; }
            .shelves { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
            .footer-pill { border-radius: 20px; justify-content: center; text-align: center; }
            .game-stats { font-size: 16px; flex-direction: column; gap: 5px; }
            .hero-logo-circle { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <div class="hero-logo-circle" style="margin: 0 auto 20px;"><img src="JESSIEMATH-Q.png"></div>
        <h2 style="color: var(--brand-blue)">Jessie Math 套圈圈挑戰賽</h2>
        <p>請輸入您的名字以開始計時積分：</p>
        <input type="text" id="player-name-input" placeholder="名字在此輸入..." maxlength="10">
        <br>
        <button class="btn-submit" onclick="startGame()">開始遊戲挑戰</button>
    </div>
</div>

<header>
    <div class="hero-left">
        <div class="hero-logo-circle"><img src="JESSIEMATH-Q.png"></div>
        <div class="brand-name">Jessie Math</div>
    </div>
    <div class="nav-right">
        <a href="https://jessiemath0703-chu.github.io/website2/" class="nav-link"><i class="fas fa-home"></i> 首頁</a>
        <a href="https://jessiemath0703-chu.github.io/Game-Lobby/" class="nav-link"><i class="fas fa-gamepad"></i> 遊戲大廳</a>
        <a href="https://jessiemath0703-chu.github.io/Game-Lobby/#g6-u7" class="nav-link back-g6"><i class="fas fa-undo"></i> 六年級圓周長與扇形周長</a>
    </div>
</header>

<main>
    <div class="game-stats">
        <span><i class="fas fa-user"></i> 玩家：<span id="display-name">---</span></span>
        <span><i class="fas fa-clock"></i> 剩餘時間：<span id="timer">60</span>s</span>
        <span><i class="fas fa-star" style="color:var(--brand-yellow)"></i> 目前積分：<span id="score">0</span></span>
    </div>

    <div class="control-panel">
        <button class="btn-ctrl btn-pause" onclick="togglePause()" id="pause-btn">暫停遊戲</button>
        <button class="btn-ctrl btn-restart" onclick="confirmReset()">重新開始</button>
    </div>

    <div class="game-header">
        <h3 style="margin:0">本關圈圈圓周長：<strong id="ring-circum" style="color: #e67e22; font-size: 1.8em;">--</strong> cm</h3>
        <p style="margin: 10px 0 0; color: #666;"><small>找出直徑，選出所有直徑小於圈圈的物品！</small></p>
    </div>

    <div class="shelves" id="shelves-container"></div>

    <div id="feedback-panel"></div>

    <button class="btn-submit" id="submit-btn" onclick="submitAnswer()">確認送出答案</button>

    <div class="rank-section">
        <h4 style="margin:0 0 10px"><i class="fas fa-trophy" style="color: #f1c40f"></i> 榮譽排行榜 (Top 5)</h4>
        <div id="rank-display">載入中...</div>
    </div>
</main>

<footer>
    <div class="footer-pill">
        <div class="footer-left">
            <div class="footer-dot"></div>
            <div class="footer-copy">© 2025–2026 Jessie Math 捷析老師. All rights reserved.</div>
        </div>
        <div class="footer-right">
            <div class="footer-tagline">數學不迷路，Jessie 帶你走向理解。</div>
            <i class="fas fa-compass" style="margin-left:5px"></i>
        </div>
    </div>
</footer>

<script>
    const PI = 3.14;
    let playerName = "";
    let score = 0;
    let timeLeft = 60;
    let isPaused = false;
    let timerInterval;
    let targetDia = 0;
    let prizes = [];

    const prizePool = [
        { i: '🧸', n: '玩偶' }, { i: '🥤', n: '珍奶' }, { i: '⚽', n: '足球' }, { i: '🍦', n: '甜筒' },
        { i: '📷', n: '相機' }, { i: '🍭', n: '棒棒糖' }, { i: '🍔', n: '漢堡' }, { i: '🚗', n: '小車' },
        { i: '🍎', n: '蘋果' }, { i: '🍩', n: '甜甜圈' }, { i: '🎮', n: '手把' }, { i: '🧢', n: '帽子' }
    ];

    function startGame() {
        const input = document.getElementById('player-name-input');
        if (!input.value.trim()) { alert("請先輸入名字！"); return; }
        playerName = input.value;
        document.getElementById('display-name').innerText = playerName;
        document.getElementById('login-overlay').style.display = 'none';
        resetGame();
    }

    function confirmReset() {
        if(confirm("確定要重新開始遊戲嗎？積分將歸零。")) resetGame();
    }

    function resetGame() {
        score = 0; timeLeft = 60; isPaused = false;
        clearInterval(timerInterval);
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('pause-btn').innerText = "暫停遊戲";
        document.getElementById('feedback-panel').style.display = 'none';
        updateRankDisplay();
        nextLevel();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) gameOver();
            }
        }, 1000);
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerText = isPaused ? "繼續遊戲" : "暫停遊戲";
        document.getElementById('submit-btn').disabled = isPaused;
    }

    function nextLevel() {
        const container = document.getElementById('shelves-container');
        const feedback = document.getElementById('feedback-panel');
        container.innerHTML = '';
        feedback.style.display = 'none';

        // 隨機生成 8-12 個物品
        const numItems = Math.floor(Math.random() * 5) + 8; 
        targetDia = Math.floor(Math.random() * 10) + 20; // 圈圈直徑 20-30
        document.getElementById('ring-circum').innerText = (targetDia * PI).toFixed(2);

        let tempPool = [...prizePool].sort(() => Math.random() - 0.5);
        prizes = [];

        for (let i = 0; i < numItems; i++) {
            let isRadius = Math.random() > 0.5;
            // 隨機調整難度：一些比圈圈大，一些比圈圈小
            let itemDia = Math.random() > 0.5 ? targetDia - 3 : targetDia + 3;
            let displayVal = isRadius ? itemDia / 2 : itemDia;
            
            prizes.push({
                id: i,
                icon: tempPool[i % tempPool.length].i,
                label: isRadius ? `半徑: ${displayVal}cm` : `直徑: ${displayVal}cm`,
                realDia: itemDia,
                canFit: targetDia > itemDia
            });

            const card = document.createElement('div');
            card.className = 'item-prize';
            card.id = `prize-${i}`;
            card.onclick = () => { if(!isPaused) card.classList.toggle('selected'); };
            card.innerHTML = `<div class="prize-icon">${prizes[i].icon}</div><div class="prize-tag">${prizes[i].label}</div>`;
            container.appendChild(card);
        }
    }

    function submitAnswer() {
        const selectedEls = document.querySelectorAll('.item-prize.selected');
        const selectedIds = Array.from(selectedEls).map(el => parseInt(el.id.split('-')[1]));
        const correctItems = prizes.filter(p => p.canFit);
        const correctIds = correctItems.map(p => p.id);

        const isCorrect = (selectedIds.length === correctIds.length) && 
                          selectedIds.every(id => correctIds.includes(id));

        const feedback = document.getElementById('feedback-panel');
        feedback.style.display = 'block';

        if (isCorrect) {
            score += 100;
            document.getElementById('score').innerText = score;
            feedback.className = 'correct';
            feedback.innerHTML = `<strong>🎉 非常出色！${playerName} 答對了！</strong><br>口徑約為 ${targetDia}cm，成功套中所有目標。積分 +100！`;
            setTimeout(nextLevel, 1800);
        } else {
            feedback.className = 'wrong';
            let ansNames = correctItems.map(p => p.label).join('、');
            feedback.innerHTML = `<strong>❌ 判斷有誤，別氣餒！</strong><br>
                <strong>正確答案應選：</strong>${ansNames}<br>
                <strong>數學解析：</strong><br>
                • 圈圈直徑 = 圓周長 (${(targetDia*PI).toFixed(2)}) ÷ 3.14 = ${targetDia}cm。<br>
                • 物品的「總寬度」(直徑) 必須小於 ${targetDia}cm 才能套中。`;
        }
    }

    function gameOver() {
        clearInterval(timerInterval);
        alert(`⏰ 時間到！\n${playerName} 您本次挑戰的總積分為：${score}`);
        saveRank(playerName, score);
        document.getElementById('login-overlay').style.display = 'flex';
    }

    function saveRank(name, score) {
        let ranks = JSON.parse(localStorage.getItem('jessiemath_ring_ranks') || '[]');
        ranks.push({ name, score, date: new Date().toLocaleDateString() });
        ranks.sort((a, b) => b.score - a.score);
        localStorage.setItem('jessiemath_ring_ranks', JSON.stringify(ranks.slice(0, 5)));
        updateRankDisplay();
    }

    function updateRankDisplay() {
        let ranks = JSON.parse(localStorage.getItem('jessiemath_ring_ranks') || '[]');
        const display = document.getElementById('rank-display');
        if(ranks.length === 0) {
            display.innerText = "目前尚無排名資料。";
        } else {
            display.innerHTML = ranks.map((r, i) => `
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #ddd;">
                    <span><strong>${i+1}.</strong> ${r.name}</span>
                    <span>${r.score} 分</span>
                </div>`).join('');
        }
    }
</script>

</body>
</html>
